apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: colours-of-safety
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: ghcr.io/merilairon/colours-of-safety-backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_NAME
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_EXPIRES_IN
            - name: REVIEWER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REVIEWER_EMAIL
            - name: REVIEWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REVIEWER_PASSWORD
            - name: APP_URL
              value: https://coloursofsafety.com
            - name: MAIL_FROM
              value: Colours of Safety <no-reply@coloursofsafety.com>
            # Transactional email (LSA-B4). Optional so the pod still starts
            # before the SMTP credentials are added to app-secrets; until
            # then the backend logs an error and sends no email.
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_PASS
                  optional: true
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: colours-of-safety
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
