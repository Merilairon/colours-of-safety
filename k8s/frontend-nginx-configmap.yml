# Production nginx config; overrides frontend/nginx.conf baked into the image.
# Keep the two in sync.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: colours-of-safety
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;

        # SPA routing: fall back to index.html for client-side routes.
        # Security headers (LSA-B9) live here, not at server level, so that
        # proxied /api/ responses keep only the backend's own (helmet) headers.
        location / {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://nominatim.openstreetmap.org https://*.ingest.de.sentry.io https://*.ingest.sentry.io https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            try_files $uri $uri/ /index.html;
        }

        # Requests for a file (anything with an extension) that does not exist get a
        # real 404 instead of the SPA shell, so crawlers and caches never see a 200
        # for missing assets (LSA-B10). Unknown app routes still get index.html and
        # the client-side 404 page, which sets noindex.
        location ~* \.[a-z0-9]+$ {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # nginx's mime.types has no entry for web app manifests.
        location = /manifest.webmanifest {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            default_type application/manifest+json;
            try_files $uri =404;
        }

        # Serve /.well-known/ files as-is (e.g. security.txt); never fall back to the SPA.
        location ^~ /.well-known/ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            default_type text/plain;
            try_files $uri =404;
        }

        # Proxy API calls to the NestJS backend service.
        location ^~ /api/ {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
